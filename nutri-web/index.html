<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>灵动食迹 · Nutri-Flow</title>
    <style>
      .boot-splash {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #5f5247;
        background: #fbf5ef;
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      }

      .boot-splash__content {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
      }

      .boot-splash__mark {
        width: 18px;
        height: 18px;
        border: 3px solid #ead7ca;
        border-top-color: #9b5b2e;
        border-radius: 50%;
        animation: boot-spin 0.8s linear infinite;
      }

      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="boot-splash" role="status" aria-live="polite">
        <div class="boot-splash__content">
          <span class="boot-splash__mark" aria-hidden="true"></span>
          <span>正在进入灵动食迹…</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
