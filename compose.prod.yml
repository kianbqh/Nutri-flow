name: nutri-flow

x-app-defaults: &app-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  networks:
    - nutri-net

services:
  gateway:
    <<: *app-defaults
    build:
      context: ./nutri-web
      dockerfile: Dockerfile
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env.prod}
      NUTRI_DOMAIN: ${NUTRI_DOMAIN:?Set NUTRI_DOMAIN in .env.prod}
      NUTRI_BASIC_AUTH_USER: ${NUTRI_BASIC_AUTH_USER:?Set NUTRI_BASIC_AUTH_USER in .env.prod}
      NUTRI_BASIC_AUTH_HASH: ${NUTRI_BASIC_AUTH_HASH:?Set NUTRI_BASIC_AUTH_HASH in .env.prod}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      business:
        condition: service_healthy

  business:
    <<: *app-defaults
    build:
      context: ./nutri-business
      dockerfile: Dockerfile
    read_only: true
    tmpfs:
      - /tmp
    environment:
      NUTRI_DB_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai"
      NUTRI_DB_USERNAME: ${MYSQL_USER}
      NUTRI_DB_PASSWORD: ${MYSQL_PASSWORD}
      NUTRI_REDIS_HOST: redis
      NUTRI_REDIS_PORT: 6379
      NUTRI_REDIS_PASSWORD: ${NUTRI_REDIS_PASSWORD}
      NUTRI_RABBITMQ_HOST: rabbitmq
      NUTRI_RABBITMQ_PORT: 5672
      NUTRI_RABBITMQ_USERNAME: ${NUTRI_RABBITMQ_USERNAME}
      NUTRI_RABBITMQ_PASSWORD: ${NUTRI_RABBITMQ_PASSWORD}
      NUTRI_OSS_ENDPOINT: http://minio:9000
      NUTRI_OSS_ACCESS_KEY: ${MINIO_ROOT_USER}
      NUTRI_OSS_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      NUTRI_OSS_BUCKET: ${NUTRI_OSS_BUCKET}
      NUTRI_OSS_REGION: us-east-1
      NUTRI_CORS_ALLOWED_ORIGINS: "https://${NUTRI_DOMAIN}"
      NUTRI_AUTH_EXPOSE_DEBUG_CODE: ${NUTRI_AUTH_EXPOSE_DEBUG_CODE:-true}
      NUTRI_LOG_LEVEL: INFO
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  agent:
    <<: *app-defaults
    build:
      context: ./nutri-agent
      dockerfile: Dockerfile
    read_only: true
    tmpfs:
      - /tmp
    environment:
      NUTRI_RABBITMQ_URL: "amqp://${NUTRI_RABBITMQ_USERNAME}:${NUTRI_RABBITMQ_PASSWORD}@rabbitmq:5672/"
      NUTRI_BUSINESS_BASE_URL: http://business:8080/api/v1
      NUTRI_MCP_SERVER_URL: http://inference:8000
      NUTRI_CHROMA_HOST: chroma
      NUTRI_CHROMA_PORT: 8000
      NUTRI_CHROMA_ENABLED: "true"
      NUTRI_LLM_PROVIDER: ${NUTRI_LLM_PROVIDER:-moonshot}
      NUTRI_LLM_API_KEY: ${NUTRI_LLM_API_KEY:-}
      NUTRI_LLM_BASE_URL: ${NUTRI_LLM_BASE_URL:-}
      NUTRI_LLM_MODEL: ${NUTRI_LLM_MODEL:-}
      NUTRI_LLM_TEMPERATURE: ${NUTRI_LLM_TEMPERATURE:-0.3}
      NUTRI_LLM_TIMEOUT_SECONDS: ${NUTRI_LLM_TIMEOUT_SECONDS:-40}
      NUTRI_AGENT_TASK_TIMEOUT_SEC: 300
    depends_on:
      business:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      chroma:
        condition: service_healthy
      inference:
        condition: service_healthy

  inference:
    <<: *app-defaults
    build:
      context: ./nutri-ai-mcp
      dockerfile: Dockerfile
    read_only: true
    tmpfs:
      - /tmp
    environment:
      NUTRI_SEG_CHECKPOINT: ${NUTRI_SEG_CHECKPOINT:-/models/stage7s1.pth}
      NUTRI_SEG_INPUT_SIZE: ${NUTRI_SEG_INPUT_SIZE:-512}
      NUTRI_REQUIRE_CHECKPOINT: ${NUTRI_REQUIRE_CHECKPOINT:-true}
    volumes:
      - ./models:/models:ro
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 90s

  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./nutri-business/src/main/resources/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - nutri-net

  redis:
    image: ${REDIS_IMAGE:-redis:7-alpine}
    restart: unless-stopped
    environment:
      NUTRI_REDIS_PASSWORD: ${NUTRI_REDIS_PASSWORD}
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --requirepass "$$NUTRI_REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$NUTRI_REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - nutri-net

  rabbitmq:
    image: ${RABBITMQ_IMAGE:-rabbitmq:3-management-alpine}
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${NUTRI_RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${NUTRI_RABBITMQ_PASSWORD}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - nutri-net

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - nutri-net

  minio-init:
    image: ${MINIO_MC_IMAGE:-minio/mc:latest}
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      NUTRI_OSS_BUCKET: ${NUTRI_OSS_BUCKET}
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"; do
          sleep 2;
        done;
        mc mb --ignore-existing "local/$$NUTRI_OSS_BUCKET";
        mc anonymous set none "local/$$NUTRI_OSS_BUCKET";
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - nutri-net

  chroma:
    image: ${CHROMA_IMAGE:-chromadb/chroma:latest}
    restart: unless-stopped
    volumes:
      - chroma_data:/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8000'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - nutri-net

networks:
  nutri-net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
  minio_data:
  chroma_data:
  caddy_data:
  caddy_config:
