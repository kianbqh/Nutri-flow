server:
  port: 8080
  address: 0.0.0.0
  servlet:
    context-path: /api

spring:
  application:
    name: nutri-business

  servlet:
    multipart:
      max-file-size: ${NUTRI_MAX_FILE_SIZE:12MB}
      max-request-size: ${NUTRI_MAX_REQUEST_SIZE:15MB}

  sql:
    init:
      mode: always

  # ── MySQL ────────────────────────────────────────────────────────────────
  datasource:
    url: ${NUTRI_DB_URL:jdbc:mysql://localhost:3307/nutri_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${NUTRI_DB_USERNAME:nutri_user}
    password: ${NUTRI_DB_PASSWORD:nutri_pass}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  # ── Redis ────────────────────────────────────────────────────────────────
  data:
    redis:
      host: ${NUTRI_REDIS_HOST:localhost}
      port: ${NUTRI_REDIS_PORT:6379}
      password: ${NUTRI_REDIS_PASSWORD:nutri_redis_pass}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  # ── RabbitMQ ─────────────────────────────────────────────────────────────
  rabbitmq:
    host: ${NUTRI_RABBITMQ_HOST:localhost}
    port: ${NUTRI_RABBITMQ_PORT:5672}
    username: ${NUTRI_RABBITMQ_USERNAME:nutri_mq}
    password: ${NUTRI_RABBITMQ_PASSWORD:nutri_mq_pass}
    virtual-host: ${NUTRI_RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 1

# ── OSS / MinIO (S3-compatible) ─────────────────────────────────────────────
oss:
  endpoint: ${NUTRI_OSS_ENDPOINT:http://localhost:9000}
  access-key: ${NUTRI_OSS_ACCESS_KEY:nutri_oss}
  secret-key: ${NUTRI_OSS_SECRET_KEY:nutri_oss_pass}
  bucket-name: ${NUTRI_OSS_BUCKET:nutri-bucket}
  region: ${NUTRI_OSS_REGION:us-east-1}

nutri:
  auth:
    expose-debug-code: ${NUTRI_AUTH_EXPOSE_DEBUG_CODE:true}
  llm:
    api-key: ${NUTRI_LLM_API_KEY:}
    base-url: ${NUTRI_LLM_BASE_URL:https://api.moonshot.cn/v1}
    model: ${NUTRI_LLM_MODEL:moonshot-v1-8k}
    temperature: ${NUTRI_LLM_TEMPERATURE:0.3}
    timeout-seconds: ${NUTRI_LLM_TIMEOUT_SECONDS:40}
  security:
    cors:
      allowed-origins: ${NUTRI_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ── RabbitMQ exchange / queue names ─────────────────────────────────────────
mq:
  exchange:
    food-analysis: nutri.food.analysis.exchange
  queue:
    food-analysis-task: nutri.food.analysis.task
    food-analysis-result: nutri.food.analysis.result
  routing-key:
    task: nutri.food.analysis.task
    result: nutri.food.analysis.result

# ── SpringDoc ────────────────────────────────────────────────────────────────
springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    com.nutriflow: ${NUTRI_LOG_LEVEL:DEBUG}
    org.springframework.amqp: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
